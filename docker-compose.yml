# Full Karban stack for local evaluation and single-host deployments.
#   cp .env.example .env    # adjust secrets
#   docker compose up -d --build
#   docker compose run --rm seed            # reference data + admin (add --demo for sample org)
# Web: http://localhost:3000 · Mail catcher: http://localhost:8025 · MinIO console: http://localhost:9001

x-api-env: &api-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  APP_TIMEZONE: Asia/Tehran
  DATABASE_URL: postgresql://${POSTGRES_USER:-karban}:${POSTGRES_PASSWORD:-karban}@postgres:5432/${POSTGRES_DB:-karban}?schema=public
  REDIS_URL: redis://redis:6379
  QUEUE_DRIVER: redis
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-Karban <no-reply@karban.local>}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_MODE: ${TELEGRAM_MODE:-disabled}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  AI_PROVIDER: ${AI_PROVIDER:-disabled}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-karban-attachments}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-karban}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-karban-minio-secret}
  S3_FORCE_PATH_STYLE: 'true'
  SENTRY_DSN: ${SENTRY_DSN:-}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karban}
      POSTGRES_DB: ${POSTGRES_DB:-karban}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-karban}']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-karban}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-karban-minio-secret}
    volumes: [miniodata:/data]
    ports: ['9001:9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/${S3_BUCKET:-karban-attachments} &&
             mc anonymous set none local/${S3_BUCKET:-karban-attachments}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-karban}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-karban-minio-secret}

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ['8025:8025']

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: karban-api:latest
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ['4000:4000']

  worker:
    image: karban-api:latest
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: http://api:4000 }
    image: karban-web:latest
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ['3000:3000']

  seed:
    image: karban-api:latest
    profiles: [tools]
    command: ['node', 'dist/cli/seed.js']
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
